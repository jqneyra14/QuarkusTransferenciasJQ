quarkus:
  application:
    name: api-gateway

  http:
    port: 8080  # Puerto único para todo el sistema
    cors:
      ~: true
      origins: "*"
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: accept,authorization,content-type

  swagger-ui:
    always-include: true
    path: /swagger-ui
    title: API Gateway - Sistema BCRP

# Configuración de REST Clients para cada microservicio
quarkus:
  rest-client:
    customer-service:
      url: http://localhost:8083
      scope: jakarta.inject.Singleton
    
    account-service:
      url: http://localhost:8085
      scope: jakarta.inject.Singleton
    
    transaction-service:
      url: http://localhost:8084
      scope: jakarta.inject.Singleton
    
    bcrp-service:
      url: http://localhost:8086
      scope: jakarta.inject.Singleton
    
    audit-service:
      url: http://localhost:8088
      scope: jakarta.inject.Singleton